version: 2

seeds:
  - name: model_prices
    description: >
      Anthropic list prices per million tokens, snapshot dated in price_date. Cache writes are
      1.25x input for the 5-minute TTL and 2x for the 1-hour TTL; cache reads vary by model.
      Refresh from https://www.anthropic.com/pricing when prices change.
    columns:
      - name: model
        data_tests: [unique, not_null]
      - name: price_date
        data_tests: [not_null]

  - name: skills
    description: >
      Skill keywords matched against ad text with DuckDB's RE2 regex. Patterns are matched on
      lower-cased text, so write them in lower case.
    columns:
      - name: skill
        data_tests: [unique, not_null]
      - name: pattern
        data_tests: [not_null]
